<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Game Power — Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="stage.css" />
</head>
<body class="stage-body">
  <header class="stage-bar">
    <div class="brand"><span class="logo-mark" aria-hidden="true"></span> DASHBOARD</div>
    <span class="stage-sum" id="stageSum">—</span>
    <div class="stage-actions">
      <label class="cols-ctl" title="Size of every tile. Fixed means each one keeps this exact size and the grid wraps.">
        Tile
        <input type="number" id="tileW" min="180" max="1200" step="10" value="300" />
        <span class="by">×</span>
        <input type="number" id="tileH" min="160" max="1200" step="10" value="520" />
      </label>
      <label class="cols-ctl"><input type="checkbox" id="fixedSize" checked /> Fixed</label>
      <label class="cols-ctl" title="How often auto click fires, and how much that gap varies">
        Click every
        <input type="number" id="clickEvery" min="0.1" max="600" step="0.1" value="1" /><span class="by">s ±</span>
        <input type="number" id="clickJitter" min="0" max="60" step="0.1" value="0.2" /><span class="by">s</span>
      </label>
      <button id="clickAllBtn" class="tiny" title="Start auto click in every loaded tile that has a spot set">⊙ Click all</button>
      <button id="clickStopBtn" class="tiny" title="Stop auto click everywhere">⊘ Stop clicks</button>
      <button id="startAllTiles" class="primary tiny">▶ Load all</button>
      <button id="stopAllTiles" class="danger tiny">Unload all</button>
    </div>
  </header>

  <div class="stage-grid" id="grid"></div>

  <script src="stage.js"></script>
</body>
</html>
